name: Test and publish
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: podtoast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Verify, vet and test
        run: |
          test -z "$(gofmt -l cmd internal)"
          go mod verify
          go vet ./...
          go test -race ./...
          CGO_ENABLED=0 go build -trimpath -o build/podtoast ./cmd/podtoast
      - name: Container startup and shutdown
        run: |
          docker build -t podtoast:test .
          docker run --rm --entrypoint /bin/sh podtoast:test -c 'for tool in bash ls find tar curl dig ip ss ps jq; do command -v "$tool" || exit 1; done; printf "{\"ok\":true}" | jq -e .ok'
          id=$(docker run -d podtoast:test)
          trap 'docker rm -f "$id" >/dev/null' EXIT
          test "$(docker inspect -f '{{.State.Running}}' "$id")" = true
          docker stop --time 5 "$id"
          test "$(docker inspect -f '{{.State.ExitCode}}' "$id")" = 0
      - name: Isolated traffic control and crash recovery
        run: |
          CGO_ENABLED=0 go test -c -o /tmp/podtoast-traffic-tests ./internal/podtoast
          docker run --rm --cap-add NET_ADMIN --network bridge -e PODTOAST_TRAFFIC_TEST=1 -v /tmp/podtoast-traffic-tests:/tests:ro --entrypoint /tests podtoast:test -test.run TestTrafficNetworkNamespace -test.v -test.timeout 90s
  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          image=ghcr.io/ikimpriv/podtoast
          echo 'tags<<END_TAGS' >> "$GITHUB_OUTPUT"
          echo "$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = tag ]; then
            echo "$image:${REF_NAME#v}" >> "$GITHUB_OUTPUT"
            case "$REF_NAME" in *-*) ;; *) echo "$image:latest" >> "$GITHUB_OUTPUT";; esac
          else
            echo "$image:edge" >> "$GITHUB_OUTPUT"
          fi
          echo 'END_TAGS' >> "$GITHUB_OUTPUT"
      - name: Publish both architectures
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/ikimpriv/PodToast
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify manifest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools inspect "ghcr.io/ikimpriv/podtoast@$DIGEST"
          echo "Published ghcr.io/ikimpriv/podtoast@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
